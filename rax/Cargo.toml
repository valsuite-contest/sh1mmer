[package]
name = "rax"
version = "0.1.0"
edition = "2021"
authors = ["SH1MMER Team"]
description = "Rust implementation of the wax shim modifying automation tool"

[[bin]]
name = "rax"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
colored = "2.1"
nix = { version = "0.29", features = ["mount", "fs", "user"] }
regex = "1.11"
byte-unit = "5.1"
which = "7.0"
